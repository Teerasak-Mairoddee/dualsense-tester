<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>DualSense</title>
<link rel="stylesheet" href="assets/css/case.css">
</head>
<body>
<main>
  <header>
    <h1>DualSense</h1>
    <span id="padInfo" class="muted"></span>
  </header>

  <section id="lock" class="panel">
    <h2>Locked</h2>
    <div class="muted">Enter the password.</div>
    <form id="lockForm">
      <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button class="primary" id="unlockBtn">Unlock</button>
    </form>
    <div id="lockMsg" class="note"></div>
  </section>

  <div id="app"></div>

  <footer>Runs entirely in your browser. Nothing is uploaded. <a href="./">Stick &amp; button tests</a> · <span id="version">v11</span></footer>
</main>

<script type="module" src="assets/js/case/unlock.js"></script>
</body>
</html>
